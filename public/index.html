const LABEL={'apk':'Debug APK','aab':'Debug AAB','both':'Debug APK + AAB','release-apk':'Release APK','release-aab':'Release AAB','release-both':'Release APK + AAB'};
const OPTS=[['apk','file','Installable Android package'],['aab','box','Android App Bundle'],['both','layers','Both files in one build'],['release-apk','shield','Signed, ready to share'],['release-aab','shield','Signed bundle for Google Play'],['release-both','shield','Both signed files']];

const TITLES={builds:'Builds',settings:'Settings',notif:'Notifications',about:'About app',credits:'Admin credits',terms:'Terms and conditions',privacy:'Privacy policy'};

let prefs={},labels={},builds=[],notifications=[],selectedFile=null,pollers={},toastTimer=null;
try{prefs=JSON.parse(localStorage.getItem(prefsKey)||'{}');labels=JSON.parse(localStorage.getItem(labelsKey)||'{}')}catch(e){}
let S={stack:['home'],theme:prefs.theme||'blue',out:prefs.output||'apk',remember:prefs.remember!==false,notifOn:prefs.notifications!==false,busy:false,uploading:false};
app.dataset.theme=S.theme;

const cur=()=>S.stack[S.stack.length-1],unread=()=>notifications.some(n=>!n.read);

function initials(n){return String(n||'AP').trim().split(/[\s_-]+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'AP'}

function buildRow(b){const name=buildName(b),keys=filesFor(b);return '<li class="b">'+avatar(name)+'<div class="t"><div class="n">'+esc(name)+'</div><div class="m">'+esc(LABEL[b.output_kind]||b.output_kind||'Android build')+(keys.length?' · '+keys.map(k=>k.toUpperCase()).join(' + '):'')+'</div><span class="st '+stateClass(b.state)+'">'+esc(stateText(b.state))+'</span>'+(b.state==='failed'?'<div class="m">'+esc((b.error||'Build failed').slice(0,180))+'</div>':'')+'</div><div class="downloads">'+keys.map(k=>'<button class="dl" data-download="'+esc(b.id)+'" data-file="'+k+'" aria-label="Download '+k.toUpperCase()+' for '+esc(name)+'">'+ic('download',18)+'</button>').join('')+'</div></li>'}
async function refreshBuilds(){try{const r=await fetch('/api/builds',{cache:'no-store'}),v=await r.json();if(!r.ok)throw Error(v.error||'Could not load build history');builds=v.builds||[];const sorted=builds.slice().sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));$('#recent').innerHTML=sorted.length?sorted.slice(0,12).map(buildCard).join(''):'<div class="hint">Your completed apps will appear here after your first build.</div>';$('#buildList').innerHTML=sorted.length?sorted.map(buildRow).join(''):'<li class="hint">No builds yet. Start your first Android build from Home.</li>';return builds}catch(e){$('#recent').innerHTML='<div class="hint">Could not load recent builds.</div>';$('#buildList').innerHTML='<li class="hint">'+esc(e.message)+'</li>';return []}}
function themeRow(){return '<div class="set col"><span class="ic">'+ic('palette',20)+'</span><div class="t"><b>Color theme</b><small>Changes the accent across the app</small></div><div class="themes" role="radiogroup" aria-label="Color theme">'+THEMES.map(t=>'<button class="tc" role="radio" aria-checked="'+(S.theme===t.k)+'" data-act="theme" data-v="'+t.k+'"><i style="background:'+t.c+'"></i>'+t.n+'</button>').join('')+'</div></div>'}
function sw(k,label){return '<button class="sw" role="switch" aria-label="'+label+'" aria-checked="'+S[k]+'" data-act="toggle" data-k="'+k+'"></button>'}
function sel(act,vals,curval){return '<select data-act="'+act+'" aria-label="'+act+'">'+vals.map(x=>'<option '+(x===curval?'selected':'')+'>'+x+'</option>').join('')+'</select>'}
function linkRow(v,icon,t,s){return '<button class="set" data-act="go" data-v="'+v+'"><span class="ic">'+ic(icon,20)+'</span><div class="t"><b>'+t+'</b><small>'+s+'</small></div><span class="chev">'+ic('chev',18)+'</span></button>'}
function infoRow(a,b){return '<div class="set"><div class="t"><b>'+a+'</b></div><span class="val">'+b+'</span></div>'}
const VIEWS={
home:()=>'<div class="hero"><h1>Compile your Android app</h1><p>Upload a project ZIP and get an installable build in minutes.</p></div><div class="card"><label class="drop"><input type="file" accept=".zip,application/zip" id="projectFile"><span class="ic">'+ic('file')+'</span><span><b>Project ZIP</b><small>Android Studio, AIDE or Flutter project</small><span class="fname" id="fname">'+(selectedFile?esc(selectedFile.name):'Choose a project ZIP')+'</span></span></label><div class="pick"><span>Output</span><b id="outLabel">'+LABEL[S.out]+'</b></div><p class="hint">ZIP limit 50 MB. Release builds need signing configuration in your project.</p><button class="cta" data-act="start" '+(S.busy?'disabled':'')+'>'+ic('upload',20)+' '+(S.busy?'Uploading / starting build…':'Start build')+'</button><div class="progress" id="progress" hidden><div class="bar2"><i id="progressBar"></i></div><span id="progressText"></span></div><p class="hint" id="buildError" style="color:#C33"></p></div><h2 class="sec">Build options</h2><div class="opts">'+OPTS.map(o=>'<button class="opt" data-act="opt" data-v="'+o[0]+'" aria-pressed="'+(S.out===o[0])+'"><span class="ic">'+ic(o[1],20)+'</span><b>'+LABEL[o[0]]+'</b><span>'+o[2]+'</span></button>').join('')+'</div><div class="rowhead"><h2 class="sec">Recent builds</h2><button class="link" data-act="go" data-v="builds">View all</button></div><div class="rail" id="recent"><span class="hint">Loading builds…</span></div>',
builds:()=>'<h1 class="ttl" style="margin:8px 0 4px">Your builds</h1><p class="hint">Your compiled Android applications</p><ul class="builds" id="buildList"><li class="hint">Loading build history…</li></ul><button class="cta" data-act="refresh">'+ic('refresh',18)+' Refresh builds</button>',
settings:()=>'<h1 class="ttl" style="margin:8px 0 4px">Settings</h1><p class="hint">Configure your build workspace</p><h2 class="sec">Build preferences</h2><div class="group"><div class="set"><span class="ic">'+ic('download',20)+'</span><div class="t"><b>Default output</b><small>Preferred artifact format</small></div>'+sel('defFmt',['APK','AAB','APK + AAB'],prefs.format||'APK')+'</div><div class="set"><span class="ic">'+ic('sliders',20)+'</span><div class="t"><b>Default build type</b><small>Debug or release</small></div>'+sel('defType',['Debug','Release'],prefs.type||'Debug')+'</div><div class="set"><span class="ic">'+ic('refresh',20)+'</span><div class="t"><b>Remember selection</b><small>Keep your last build format</small></div>'+sw('remember','Remember selection')+'</div></div><h2 class="sec">Appearance</h2><div class="group">'+themeRow()+'</div><h2 class="sec">Storage and notifications</h2><div class="group"><div class="set"><span class="ic">'+ic('tag',20)+'</span><div class="t"><b>Build labels</b><small>Clear locally saved project names</small></div><button class="go" data-act="clear">Clear</button></div><div class="set"><span class="ic">'+ic('bell',20)+'</span><div class="t"><b>Build notifications</b><small>Show completion and failure</small></div>'+sw('notifOn','Build notifications')+'</div></div><h2 class="sec">About</h2><div class="group">'+linkRow('about','info','About app','Version 1.0.0')+linkRow('credits','user','Admin credits','Android Cus')+linkRow('terms','doc','Terms and conditions','How you can use the app')+linkRow('privacy','lock','Privacy policy','How your data is handled')+'</div><p class="foot">App Compiler 1.0.0 · Admin: Android Cus</p>',
notif:()=>'<h1 class="ttl" style="margin:8px 0 12px">Notifications</h1><div class="group">'+(notifications.length?notifications.map((n,i)=>'<button class="nitem '+(n.read?'':'unread')+'" data-act="read" data-i="'+i+'"><span class="ni">'+ic(n.type==='ok'?'ok':n.type==='wait'?'clock':'info',20)+'</span><span class="nt"><b>'+esc(n.title)+'</b><span>'+esc(n.body)+'</span><small>'+esc(n.time)+'</small></span>'+(n.read?'':'<i class="udot"></i>')+'</button>').join(''):'<div class="set">No notifications yet. Build updates will appear here.</div>')+'</div><button class="link" data-act="readall" style="margin-top:12px">Mark all as read</button>',
about:()=>'<div class="center"><span class="bigmark">'+ic('box',36)+'</span><b>App Compiler</b><span>Version 1.0.0</span></div><div class="doc"><h3>What it does</h3><p>App Compiler turns a zipped Android project into an installable build, right from your phone.</p><h3>What you can do</h3><ul><li>Upload Android Studio, AIDE or Flutter projects.</li><li>Build debug or release APKs and AAB bundles.</li><li>Follow builds and download results from the Builds page.</li></ul></div><h2 class="sec">Details</h2><div class="group">'+infoRow('Version','1.0.0')+infoRow('Output formats','APK, AAB')+infoRow('ZIP limit','50 MB')+infoRow('Admin','Android Cus')+'</div>',
credits:()=>'<div class="center"><span class="bigmark">AC</span><b>Android Cus</b><span>Admin and developer</span></div><div class="doc"><p style="text-align:center;margin-top:10px">App Compiler is designed, built and maintained by Android Cus.</p></div><h2 class="sec">Credits</h2><div class="group">'+infoRow('Admin','Android Cus')+infoRow('Product','App Compiler')+infoRow('Version','1.0.0')+'</div>',
terms:()=>'<div class="doc"><h3>1. Using App Compiler</h3><p>App Compiler turns the Android project ZIP you upload into an APK or AAB build.</p><h3>2. Your projects</h3><p>You keep ownership of everything you upload. Only upload projects you own or have permission to build.</p><h3>3. Acceptable use</h3><p>Do not upload malware, unlawful projects, or code that infringes another person’s rights.</p><h3>4. Builds and availability</h3><p>Builds may queue, take time, or fail if a project cannot be compiled. ZIP files are limited to 50 MB. Release builds need signing configuration.</p><h3>5. Signing keys</h3><p>You are responsible for protecting keystores and signing passwords included in your project.</p><h3>6. Contact</h3><p>Questions can be directed to Android Cus.</p></div>',
privacy:()=>'<div class="doc"><h3>What we process</h3><p>The project ZIP you upload, your selected build options, build status, and generated APK/AAB files.</p><h3>How it is used</h3><p>Project files are processed by the remote build service to compile and deliver your requested artifacts.</p><h3>Storage</h3><p>Build records and artifacts are stored in the service backend. Avoid including secrets you do not want processed by a remote build service.</p><h3>Your choices</h3><p>You can clear locally saved build labels and turn build notifications off in Settings.</p><h3>Contact</h3><p>Privacy questions can be directed to Android Cus.</p></div>'
};
function renderBar(){const v=cur();bar.innerHTML=v==='home'?'<div class="brand"><span class="logo">'+ic('box',20)+'</span>App Compiler</div><button class="icbtn" data-act="go" data-v="notif" aria-label="Notifications">'+ic('bell',20)+(unread()?'<span class="badge"></span>':'')+'</button><button class="icbtn" data-act="go" data-v="settings" aria-label="Settings">'+ic('gear',20)+'</button>':'<button class="icbtn" data-act="back" aria-label="Back">'+ic('back',20)+'</button><h1 class="ttl">'+(TITLES[v]||v)+'</h1>'+(v==='notif'?'<button class="link" data-act="readall">Mark all read</button>':'')}
function renderNav(){nav.hidden=!MAIN.includes(cur());nav.innerHTML=[['home','Home','home'],['builds','Builds','layers'],['settings','Settings','gear']].map(t=>'<button class="tab" data-act="tab" data-v="'+t[0]+'" aria-selected="'+(cur()===t[0])+'"><span class="ti">'+ic(t[2])+'</span><span>'+t[1]+'</span></button>').join('')}
function renderView(anim){view.className='view'+(anim?' anim':'');view.innerHTML=VIEWS[cur()]();if(cur()==='home'){const f=$('#projectFile');f.addEventListener('change',()=>{selectedFile=f.files[0]||null;$('#fname').textContent=selectedFile?selectedFile.name:'Choose a project ZIP'})}if(cur()==='settings'){const fmt=$('[data-act=defFmt]'),typ=$('[data-act=defType]');fmt.value=prefs.format||'APK';typ.value=prefs.type||'Debug'}}
function renderAll(anim){renderBar();renderNav();renderView(anim)}
function go(v){if(cur()!==v){S.stack.push(v);renderAll(true);if(v==='builds')refreshBuilds()}}
function back(){if(S.stack.length>1){S.stack.pop();renderAll(true)}}
function tab(v){S.stack=['home',v];if(v==='home')S.stack=['home'];renderAll(true);if(v==='builds')refreshBuilds()}
function setProgress(p,t){const box=$('#progress');if(!box)return;box.hidden=false;$('#progressBar').style.width=Math.max(0,Math.min(100,p))+'%';$('#progressText').textContent=t}
async function startBuild(){if(S.busy)return;if(!selectedFile){toast('Choose a project ZIP first');return}if(!/\.zip$/i.test(selectedFile.name)){toast('Choose a .zip file');return}if(selectedFile.size>50*1024*1024){toast('This ZIP is over the 50 MB limit');return}
S.busy=true;const btn=$('[data-act=start]');if(btn){btn.disabled=true;btn.textContent='Preparing upload…'}setProgress(0,'Preparing secure upload…');const err=$('#buildError');if(err)err.textContent='';
try{const signRes=await fetch('/api/upload-url',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({filename:selectedFile.name})});const sign=await signRes.json();if(!signRes.ok)throw Error(sign.error||'Could not prepare secure upload.');
await new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open('PUT',sign.uploadUrl);x.setRequestHeader('Content-Type','application/zip');x.upload.onprogress=e=>{if(e.lengthComputable)setProgress(e.loaded/e.total*75,'Uploading project · '+Math.round(e.loaded/e.total*100)+'%')};x.onload=()=>x.status>=200&&x.status<300?resolve():reject(Error('Object Storage upload failed ('+x.status+'). Check your connection and retry.'));x.onerror=()=>reject(Error('Network error during upload. Check your connection and retry.'));x.send(selectedFile)});
setProgress(82,'Starting Android build…');const startRes=await fetch('/api/build',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pathname:sign.pathname,output:S.out})});const job=await startRes.json();if(!startRes.ok)throw Error(job.error||'Could not start build.');
labels[job.jobId]=selectedFile.name.replace(/\.zip$/i,'');localStorage.setItem(labelsKey,JSON.stringify(labels));S.busy=false;toast('Build started');go('builds');await refreshBuilds();pollJob(job.jobId);
}catch(e){S.busy=false;const er=$('#buildError');if(er)er.textContent=e.message;const pr=$('#progressText');if(pr)pr.textContent='Build could not start';const b=$('[data-act=start]');if(b)b.disabled=false;toast(e.message)}
}
async function pollJob(id){try{const r=await fetch('/api/status?id='+encodeURIComponent(id),{cache:'no-store'}),v=await r.json();if(!r.ok)throw Error(v.error||'Status unavailable');await refreshBuilds();if(v.state==='complete'){toast('Build completed — ready to download');notifications.unshift({type:'ok',title:'Build completed',body:buildName({id:id})+' is ready to download.',time:'Just now',read:false});renderBar();return}if(v.state==='failed'){toast('Build failed — see details in Builds');notifications.unshift({type:'wait',title:'Build failed',body:v.error||'Build failed.',time:'Just now',read:false});renderBar();return}setTimeout(()=>pollJob(id),5000)}catch(e){setTimeout(()=>pollJob(id),8000)}}
app.addEventListener('click',e=>{const a=e.target.closest('[data-act],[data-download]');if(!a)return;if(a.hasAttribute('data-download')){if(!a.disabled&&a.dataset.file)download(a.dataset.download,a.dataset.file);return}const act=a.dataset.act,v=a.dataset.v;if(act==='go')go(v);else if(act==='back')back();else if(act==='tab')tab(v);else if(act==='start')startBuild();else if(act==='opt'){S.out=v;savePrefs();renderView(false)}else if(act==='refresh')refreshBuilds().then(()=>toast('Build list refreshed'));else if(act==='toggle'){S[a.dataset.k]=!S[a.dataset.k];a.setAttribute('aria-checked',S[a.dataset.k]);savePrefs()}else if(act==='theme'){S.theme=v;app.dataset.theme=v;view.querySelectorAll('.tc').forEach(b=>b.setAttribute('aria-checked',b.dataset.v===v));savePrefs();toast(THEMES.find(t=>t.k===v).n+' theme applied')}else if(act==='clear'){if(confirm('Clear locally saved build names? Build records and files will remain.')){labels={};localStorage.removeItem(labelsKey);refreshBuilds();toast('Saved labels cleared')}}else if(act==='read'){notifications[+a.dataset.i].read=true;renderBar();renderView(false)}else if(act==='readall'){notifications.forEach(n=>n.read=true);renderBar();renderView(false)}});
app.addEventListener('change',e=>{const a=e.target,act=a.dataset.act;if(act==='defFmt'||act==='defType'){prefs[act==='defFmt'?'format':'type']=a.value;const f=prefs.format||'APK',t=prefs.type||'Debug';S.out=(t==='Release'?'release-':'')+({'APK':'apk','AAB':'aab','APK + AAB':'both'}[f]);savePrefs();toast('Default is now '+LABEL[S.out])}});
if(S.remember===false)S.out='apk';else if(prefs.format||prefs.type){const f=prefs.format||'APK',t=prefs.type||'Debug';S.out=(t==='Release'?'release-':'')+({'APK':'apk','AAB':'aab','APK + AAB':'both'}[f])}
renderAll(false);refreshBuilds();
</script></body></html>
